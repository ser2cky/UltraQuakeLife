// Aliases for new weapon features
// - serecky 11.14.25
alias +primary "impulse 17;+attack"
alias -primary "-attack"

alias +secondary "impulse 18;+attack"
alias -secondary "-attack"

alias +reload "impulse 19"
alias -reload ""

bind mouse1 "+primary"
bind mouse2 "+secondary"
bind r "+reload"

cl_bob "0.01"
cl_bobcycle "0.8"

alias zoom_crossbow "fov 20"
alias zoom_python "fov 40"
alias unzoom "fov 90"

cl_bob 0.01
cl_bobcycle 0.8

bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind 9 "impulse 9"
bind b "impulse 13"